<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>M3S 時間軸提示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    body { background-color: #0a0a0a; color: #f5f5f5; font-family: sans-serif; margin: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #404040; border-radius: 10px; }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 font-sans flex flex-col selection:bg-amber-500/30 overflow-hidden">
  <div id="app" v-cloak class="flex flex-col h-screen">
    <!-- Header -->
    <header class="px-6 py-3 border-b border-neutral-800 bg-neutral-900/50 flex justify-between items-center z-10 backdrop-blur-md">
      <div class="flex items-center gap-6">
        <h1 class="text-xl font-bold tracking-tight text-amber-500 flex items-center gap-2">
          <lucide-icon name="clock" class="w-5 h-5"></lucide-icon>
          <span class="font-sans">{{ currentTab }} 時間軸提示</span>
        </h1>
        
        <!-- Tabs -->
        <div class="flex bg-neutral-800/80 p-1 rounded-lg border border-neutral-700/50 relative">
          <button 
            @click="switchTab('M3S')" 
            :class="['px-4 py-1.5 rounded-md text-sm font-bold transition-all z-10', currentTab === 'M3S' ? 'text-white shadow-sm' : 'text-neutral-400 hover:text-neutral-200']"
          >
            M3S
          </button>
          <button 
            @click="switchTab('M4S')" 
            :class="['px-4 py-1.5 rounded-md text-sm font-bold transition-all z-10', currentTab === 'M4S' ? 'text-white shadow-sm' : 'text-neutral-400 hover:text-neutral-200']"
          >
            M4S
          </button>
          <div 
            class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-neutral-700/80 rounded-md transition-all duration-300 pointer-events-none"
            :style="{ transform: currentTab === 'M3S' ? 'translateX(4px)' : 'translateX(calc(100% + 4px))' }"
          ></div>
        </div>
      </div>
      <button 
        @click="soundEnabled = !soundEnabled"
        class="p-2 rounded-full hover:bg-neutral-800 text-neutral-400 hover:text-white transition-colors"
        :title="soundEnabled ? '停用音效提示' : '啟用音效提示'"
      >
        <lucide-icon v-if="soundEnabled" name="volume-2" class="w-5 h-5"></lucide-icon>
        <lucide-icon v-else name="volume-x" class="w-5 h-5"></lucide-icon>
      </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 h-[calc(100vh-60px)] overflow-y-auto custom-scrollbar flex flex-col lg:flex-row gap-6 items-start">
      
      <!-- Left Side -->
      <section class="w-full lg:w-[45%] flex flex-col gap-5 shrink-0">
        <div class="bg-neutral-900/40 border border-neutral-800 rounded-3xl p-5 md:p-6 flex flex-col items-center">
          <h2 class="text-neutral-500 font-medium tracking-widest text-xs mb-2 uppercase font-sans">
            Elapsed Time
          </h2>
          <div class="text-6xl lg:text-7xl font-bold font-mono tracking-tighter text-white tabular-nums drop-shadow-sm mb-5">
            {{ formatTime(elapsed) }}
          </div>

          <div class="flex gap-2 w-full justify-center mb-5">
             <button @click="handleAdjustTime(-1)" class="flex items-center gap-1 px-3 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs transition-all font-medium active:scale-95">
               <lucide-icon name="skip-back" class="w-4 h-4"></lucide-icon> 1s
             </button>
             <button @click="handleAdjustTime(-0.1)" class="px-3 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs transition-all font-medium active:scale-95">
               -0.1s
             </button>
             <button @click="handleAdjustTime(0.1)" class="px-3 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs transition-all font-medium active:scale-95">
               +0.1s
             </button>
             <button @click="handleAdjustTime(1)" class="flex items-center gap-1 px-3 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs transition-all font-medium active:scale-95">
               1s <lucide-icon name="skip-forward" class="w-4 h-4"></lucide-icon>
             </button>
          </div>

          <div class="flex gap-3 w-full">
            <button 
              @click="handlePlayPause"
              :class="[
                'flex-1 flex items-center justify-center gap-2 py-4 rounded-2xl font-bold text-lg transition-all active:scale-[0.98]',
                isPlaying ? 'bg-neutral-800 text-amber-500 hover:bg-neutral-700 font-sans' : 'bg-amber-600 text-white hover:bg-amber-500 shadow-lg shadow-amber-900/20 font-sans'
              ]"
            >
              <lucide-icon v-if="isPlaying" name="pause" class="w-6 h-6 fill-current"></lucide-icon>
              <lucide-icon v-else name="play" class="w-6 h-6 fill-current"></lucide-icon>
              {{ isPlaying ? '暫停計時' : '開始計時' }}
            </button>
            <button 
              @click="handleReset"
              class="px-5 py-4 rounded-2xl bg-neutral-800 text-neutral-400 hover:bg-neutral-700 hover:text-white transition-all flex items-center justify-center active:scale-[0.98]"
              title="重設時間"
            >
              <lucide-icon name="rotate-ccw" class="w-6 h-6"></lucide-icon>
            </button>
          </div>
        </div>
      </section>

      <!-- Right Side -->
      <section class="w-full lg:w-[55%] flex flex-col gap-5">
        
        <!-- Next Event Target -->
        <div class="w-full bg-gradient-to-br from-neutral-800/90 to-neutral-900/90 border border-neutral-700/50 rounded-3xl p-6 relative overflow-hidden shadow-xl shrink-0">
          <div class="absolute top-0 left-0 w-full h-1.5 bg-neutral-800">
             <div v-if="nextEvent" class="h-full bg-amber-500 transition-all ease-linear" :style="{ width: progressPercent + '%' }"></div>
          </div>
          
          <h3 class="text-neutral-400 font-medium mb-3 flex items-center gap-2 text-sm uppercase tracking-wider font-sans">
            <lucide-icon name="arrow-right" class="w-4 h-4 text-amber-500"></lucide-icon>即將到來
          </h3>
          
          <div v-if="nextEvent" class="flex flex-col gap-2">
            <div class="text-3xl lg:text-4xl font-bold text-white tracking-tight break-keep font-sans pb-2 flex items-center gap-3">
              {{ nextEvent.name }}
              <span v-if="nextEvent.phase" class="text-sm px-2.5 py-1 rounded-md bg-neutral-800/80 text-amber-500/80 font-normal border border-amber-500/20">{{ nextEvent.phase }}</span>
            </div>
            <div class="flex items-end justify-between mt-1 pt-3 border-t border-neutral-700/50">
              <div class="tabular-nums font-mono text-neutral-400">
                <span class="text-xs uppercase mr-2 tracking-wider">Time</span>
                <span class="text-amber-500 font-bold px-2 py-1 bg-amber-500/10 rounded-lg">{{ nextEvent.timeStr }}</span>
              </div>
              <div :class="['text-4xl tabular-nums font-mono font-black', remainingTimeSec <= 5.0 ? 'text-red-500 animate-pulse drop-shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'text-neutral-300']">
                -{{ remainingTimeStr }}<span class="text-2xl text-neutral-500">s</span>
              </div>
            </div>

            <!-- Mechanic State Toggles -->
            <div v-if="nextEvent.name.includes('金臂鈎') || nextEvent.name.includes('強震衝') || nextEvent.name.includes('大亂擊')" class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full mt-4">
              
              <!-- Lariat -->
              <div v-if="nextEvent.name.includes('金臂鈎')" class="bg-neutral-900/60 border border-neutral-800 rounded-2xl p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <span class="text-neutral-400 font-bold text-sm tracking-widest leading-none">金臂鈎</span>
                  <button v-if="lariatState || lariatSplit" @click="lariatState = null; lariatSplit = null" class="text-xs font-medium text-neutral-500 hover:text-neutral-300 transition-colors bg-neutral-800/80 px-2 py-1 rounded-md leading-none">清除</button>
                </div>
                <div class="flex flex-col gap-2">
                  <div class="flex gap-2">
                    <button @click="lariatState = 'fire'" :class="['flex-1 py-3 rounded-xl border flex flex-col items-center justify-center transition-all', lariatState === 'fire' ? 'bg-red-500/20 border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 hover:bg-neutral-800 hover:border-neutral-600']">
                      <span :class="['text-xs flex items-center gap-1 mb-1', lariatState === 'fire' ? 'text-red-300' : 'text-neutral-400']">
                        <lucide-icon v-if="lariatState === 'fire'" name="flame" class="w-3 h-3"></lucide-icon> 有火
                      </span>
                      <span :class="['font-black text-xl tracking-widest', lariatState === 'fire' ? 'text-red-400 drop-shadow-[0_0_8px_rgba(239,68,68,0.8)] animate-pulse' : 'text-neutral-500']">圈內</span>
                    </button>
                    <button @click="lariatState = 'no-fire'" :class="['flex-1 py-3 rounded-xl border flex flex-col items-center justify-center transition-all', lariatState === 'no-fire' ? 'bg-blue-500/20 border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 hover:bg-neutral-800 hover:border-neutral-600']">
                      <span :class="['text-xs flex items-center gap-1 mb-1', lariatState === 'no-fire' ? 'text-blue-300' : 'text-neutral-400']">
                        <lucide-icon v-if="lariatState === 'no-fire'" name="circle-off" class="w-3 h-3"></lucide-icon> 無火
                      </span>
                      <span :class="['font-black text-xl tracking-widest', lariatState === 'no-fire' ? 'text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.8)] animate-pulse' : 'text-neutral-500']">圈外</span>
                    </button>
                  </div>
                  <div class="flex gap-2">
                    <button @click="lariatSplit = '4'" :class="['flex-1 py-2 rounded-xl border flex items-center justify-center gap-1 transition-all', lariatSplit === '4' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 text-neutral-300 hover:bg-neutral-800 hover:border-neutral-600']">
                      <lucide-icon name="users" class="w-4 h-4"></lucide-icon> <span class="font-bold text-sm">四分</span>
                    </button>
                    <button @click="lariatSplit = '8'" :class="['flex-1 py-2 rounded-xl border flex items-center justify-center gap-1 transition-all', lariatSplit === '8' ? 'bg-purple-500/20 border-purple-500/50 text-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 text-neutral-300 hover:bg-neutral-800 hover:border-neutral-600']">
                      <lucide-icon name="users" class="w-4 h-4"></lucide-icon> <span class="font-bold text-sm">八分</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Quake -->
              <div v-if="nextEvent.name.includes('強震衝')" class="bg-neutral-900/60 border border-neutral-800 rounded-2xl p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <span class="text-neutral-400 font-bold text-sm tracking-widest leading-none">強震衝</span>
                  <button v-if="quakeState || quakeSplit" @click="quakeState = null; quakeSplit = null" class="text-xs font-medium text-neutral-500 hover:text-neutral-300 transition-colors bg-neutral-800/80 px-2 py-1 rounded-md leading-none">清除</button>
                </div>
                <div class="flex flex-col gap-2">
                  <div class="flex gap-2">
                    <button @click="quakeState = 'fire'" :class="['flex-1 py-3 rounded-xl border flex flex-col items-center justify-center transition-all', quakeState === 'fire' ? 'bg-red-500/20 border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 hover:bg-neutral-800 hover:border-neutral-600']">
                      <span :class="['text-xs flex items-center gap-1 mb-1', quakeState === 'fire' ? 'text-red-300' : 'text-neutral-400']">
                        <lucide-icon v-if="quakeState === 'fire'" name="flame" class="w-3 h-3"></lucide-icon> 有火
                      </span>
                      <span :class="['font-black text-xl tracking-wider', quakeState === 'fire' ? 'text-red-400 drop-shadow-[0_0_8px_rgba(239,68,68,0.8)] animate-pulse' : 'text-neutral-500']">防擊退</span>
                    </button>
                    <button @click="quakeState = 'no-fire'" :class="['flex-1 py-3 rounded-xl border flex flex-col items-center justify-center transition-all', quakeState === 'no-fire' ? 'bg-blue-500/20 border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 hover:bg-neutral-800 hover:border-neutral-600']">
                      <span :class="['text-xs flex items-center gap-1 mb-1', quakeState === 'no-fire' ? 'text-blue-300' : 'text-neutral-400']">
                        <lucide-icon v-if="quakeState === 'no-fire'" name="circle-off" class="w-3 h-3"></lucide-icon> 無火
                      </span>
                      <span :class="['font-black text-xl tracking-wider', quakeState === 'no-fire' ? 'text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.8)] animate-pulse' : 'text-neutral-500']">距離衰減</span>
                    </button>
                  </div>
                  <div class="flex gap-2">
                    <button @click="quakeSplit = '4'" :class="['flex-1 py-2 rounded-xl border flex items-center justify-center gap-1 transition-all', quakeSplit === '4' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 text-neutral-300 hover:bg-neutral-800 hover:border-neutral-600']">
                      <lucide-icon name="users" class="w-4 h-4"></lucide-icon> <span class="font-bold text-sm">四分</span>
                    </button>
                    <button @click="quakeSplit = '8'" :class="['flex-1 py-2 rounded-xl border flex items-center justify-center gap-1 transition-all', quakeSplit === '8' ? 'bg-purple-500/20 border-purple-500/50 text-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 text-neutral-300 hover:bg-neutral-800 hover:border-neutral-600']">
                      <lucide-icon name="users" class="w-4 h-4"></lucide-icon> <span class="font-bold text-sm">八分</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Chain -->
              <div v-if="nextEvent.name.includes('大亂擊')" class="bg-neutral-900/60 border border-neutral-800 rounded-2xl p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <span class="text-neutral-400 font-bold text-sm tracking-widest leading-none">野蠻大亂擊</span>
                  <button v-if="chainSplit" @click="chainSplit = null" class="text-xs font-medium text-neutral-500 hover:text-neutral-300 transition-colors bg-neutral-800/80 px-2 py-1 rounded-md leading-none">清除</button>
                </div>
                <div class="flex gap-2">
                  <button @click="chainSplit = '4'" :class="['flex-1 py-2 rounded-xl border flex items-center justify-center gap-1 transition-all', chainSplit === '4' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 text-neutral-300 hover:bg-neutral-800 hover:border-neutral-600']">
                    <lucide-icon name="users" class="w-4 h-4"></lucide-icon> <span class="font-bold text-sm">四分</span>
                  </button>
                  <button @click="chainSplit = '8'" :class="['flex-1 py-2 rounded-xl border flex items-center justify-center gap-1 transition-all', chainSplit === '8' ? 'bg-purple-500/20 border-purple-500/50 text-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.2)]' : 'bg-neutral-800/50 border-neutral-700/50 text-neutral-300 hover:bg-neutral-800 hover:border-neutral-600']">
                    <lucide-icon name="users" class="w-4 h-4"></lucide-icon> <span class="font-bold text-sm">八分</span>
                  </button>
                </div>
              </div>
            </div>
            
          </div>
          <div v-else class="text-neutral-500 italic py-6 text-center font-sans tracking-wide">
            副本機制已全部結束
          </div>
        </div>

        <!-- Timeline List -->
        <div 
          ref="containerRef"
          class="w-full h-[280px] overflow-y-auto custom-scrollbar relative scroll-smooth bg-neutral-900/40 border border-neutral-800 rounded-3xl p-3 shrink-0"
        >
           <div class="flex flex-col gap-2 pb-16">
             <div 
               v-for="ev in timeline" 
               :key="ev.id"
               :id="'event-' + ev.id"
               @click="handleJumpToTime(ev.timeSec)"
               :class="[
                 'flex items-center gap-3 py-3 px-4 rounded-xl transition-all duration-300 font-sans cursor-pointer group hover:scale-[1.02] active:scale-[0.98]',
                 nextEvent?.id === ev.id ? 'bg-amber-500/15 border border-amber-500/30 shadow-md shadow-amber-900/20 backdrop-blur-sm' : 'hover:bg-neutral-800/80 border border-transparent',
                 elapsed > ev.timeSec + 2 ? 'opacity-30 mix-blend-luminosity grayscale hover:opacity-80' : 'opacity-100'
               ]"
             >
               <div :class="['w-12 md:w-14 text-right tabular-nums font-mono font-medium text-sm', nextEvent?.id === ev.id ? 'text-amber-400' : 'text-neutral-500 group-hover:text-neutral-400 transition-colors']">
                 {{ ev.timeStr }}
               </div>
               
               <div class="relative flex items-center justify-center shrink-0 w-3 h-3">
                 <div :class="['absolute w-2 h-2 rounded-full transition-all duration-500 outline outline-3 outline-neutral-900', elapsed > ev.timeSec + 2 ? 'bg-neutral-600 outline-transparent' : nextEvent?.id === ev.id ? 'bg-amber-500 scale-150 animate-pulse shadow-[0_0_10px_rgba(245,158,11,0.6)]' : 'bg-neutral-500']"></div>
               </div>

               <div :class="['flex-1 font-bold text-sm md:text-base truncate transition-colors px-1', nextEvent?.id === ev.id ? 'text-amber-50' : elapsed > ev.timeSec + 2 ? 'text-neutral-600 group-hover:text-neutral-300' : 'text-neutral-300']">
                 <span v-if="ev.phase" class="mr-2 px-2 py-0.5 rounded bg-neutral-800 text-neutral-400 text-xs">{{ ev.phase }}</span>
                 {{ ev.name }}
               </div>
             </div>
           </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const { createApp, ref, computed, watch, onMounted, onUnmounted, nextTick } = Vue;

    const LucideIcon = {
      props: ['name'],
      computed: {
        svgContent() {
          const dict = {
            'clock': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
            'volume-2': '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
            'volume-x': '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="17" y1="9" y2="15"/><line x1="17" x2="23" y1="9" y2="15"/>',
            'skip-back': '<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/>',
            'skip-forward': '<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/>',
            'arrow-right': '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
            'play': '<polygon points="6 3 20 12 6 21 6 3"/>',
            'pause': '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
            'rotate-ccw': '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
            'flame': '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
            'circle-off': '<path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/>',
            'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
          };
          return dict[this.name] || '';
        }
      },
      template: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" v-html="svgContent"></svg>`
    };

    const M3S_TIMELINE = [
      { id: 1, timeSec: 11.2, timeStr: "00:11.2", name: "野蠻碎擊", phase: "" },
      { id: 2, timeSec: 20.5, timeStr: "00:20.5", name: "拳面猛擊*4", phase: "" },
      { id: 3, timeSec: 37.6, timeStr: "00:37.6", name: "金臂鈎", phase: "" },
      { id: 4, timeSec: 51.8, timeStr: "00:51.8", name: "強震衝+野蠻碎擊", phase: "" },
      { id: 5, timeSec: 87.5, timeStr: "01:27.5", name: "踩塔爆炸", phase: "" },
      { id: 6, timeSec: 143.6, timeStr: "02:23.6", name: "金臂鈎", phase: "" },
      { id: 7, timeSec: 157.8, timeStr: "02:37.8", name: "強震衝+野蠻碎擊", phase: "" },
      { id: 8, timeSec: 177.4, timeStr: "02:57.4", name: "拳面猛擊*6", phase: "" },
      { id: 9, timeSec: 226.7, timeStr: "03:46.7", name: "金臂鈎+野蠻碎擊", phase: "" },
      { id: 10, timeSec: 265.9, timeStr: "04:25.9", name: "長短炸彈爆炸", phase: "" },
      { id: 11, timeSec: 282.1, timeStr: "04:42.1", name: "強震衝", phase: "" },
      { id: 12, timeSec: 305.0, timeStr: "05:05.0", name: "踩引信-1", phase: "" },
      { id: 13, timeSec: 325.0, timeStr: "05:25.0", name: "踩引信-2", phase: "" },
      { id: 14, timeSec: 354.4, timeStr: "05:54.4", name: "拳面猛擊*6", phase: "" },
      { id: 15, timeSec: 391.9, timeStr: "06:31.9", name: "超豪華野蠻大亂擊-1", phase: "超豪華大亂擊" },
      { id: 16, timeSec: 395.4, timeStr: "06:35.4", name: "超豪華野蠻大亂擊-2+野蠻爆震", phase: "" },
      { id: 17, timeSec: 474.8, timeStr: "07:54.8", name: "強震衝+野蠻碎擊", phase: "" },
      { id: 18, timeSec: 497.8, timeStr: "08:17.8", name: "拳面猛擊*8", phase: "" },
      { id: 19, timeSec: 537.7, timeStr: "08:57.7", name: "炸彈爆炸", phase: "" },
      { id: 20, timeSec: 548.2, timeStr: "09:08.2", name: "金臂鈎+野蠻碎擊", phase: "" },
      { id: 21, timeSec: 615.2, timeStr: "10:15.2", name: "拳面猛擊*8", phase: "" },
      { id: 22, timeSec: 658.2, timeStr: "10:58.2", name: "究極超豪華野蠻大亂擊", phase: "究極超豪華大亂擊" }
    ];

    const M4S_TIMELINE = [
      { id: 1, timeSec: 15.2, timeStr: "00:15.2", phase: "魔女狩獵", name: "宙斯之怒" },
      { id: 2, timeSec: 49.4, timeStr: "00:49.4", phase: "", name: "魔女狩獵" },
      { id: 3, timeSec: 99.1, timeStr: "01:39.1", phase: "", name: "宙斯之怒" },
      { id: 4, timeSec: 135.6, timeStr: "02:15.6", phase: "雷轉質展開", name: "四/八雷星-1" },
      { id: 5, timeSec: 191.1, timeStr: "03:11.1", phase: "", name: "四/八雷星-2" },
      { id: 6, timeSec: 209.3, timeStr: "03:29.3", phase: "", name: "狡詭落雷" },
      { id: 7, timeSec: 251.6, timeStr: "04:11.6", phase: "離子簇", name: "前後砲-1" },
      { id: 8, timeSec: 269.9, timeStr: "04:29.9", phase: "", name: "前後砲-2" },
      { id: 9, timeSec: 290.3, timeStr: "04:50.3", phase: "", name: "狡詭搖盪" },
      { id: 10, timeSec: 335.6, timeStr: "05:35.6", phase: "雷轉質移植", name: "擋槍-1" },
      { id: 11, timeSec: 361.9, timeStr: "06:01.9", phase: "", name: "擋槍-2" },
      { id: 12, timeSec: 378.3, timeStr: "06:18.3", phase: "", name: "靈魂震盪" },
      { id: 13, timeSec: 386.9, timeStr: "06:26.9", phase: "", name: "後半開始" },
      { id: 14, timeSec: 412.3, timeStr: "06:52.3", phase: "開場", name: "交叉亂尾擊" },
      { id: 15, timeSec: 456.5, timeStr: "07:36.5", phase: "接線分散+水火劍", name: "芥末炸彈" },
      { id: 16, timeSec: 483.0, timeStr: "08:03.0", phase: "", name: "尖尾刺" },
      { id: 17, timeSec: 504.3, timeStr: "08:24.3", phase: "", name: "青雷" },
      { id: 18, timeSec: 510.8, timeStr: "08:30.8", phase: "日落", name: "日落" },
      { id: 19, timeSec: 540.3, timeStr: "09:00.3", phase: "午夜", name: "午夜" },
      { id: 20, timeSec: 551.1, timeStr: "09:11.1", phase: "", name: "光束引導" },
      { id: 21, timeSec: 567.4, timeStr: "09:27.4", phase: "", name: "狡詭雷電" },
      { id: 22, timeSec: 593.9, timeStr: "09:53.9", phase: "", name: "分MT/ST組踩塔" },
      { id: 23, timeSec: 641.2, timeStr: "10:41.2", phase: "", name: "尖尾刺" },
      { id: 24, timeSec: 657.2, timeStr: "10:57.2", phase: "", name: "芥末炸彈" },
      { id: 25, timeSec: 666.9, timeStr: "11:06.9", phase: "", name: "屬性轉換" },
      { id: 26, timeSec: 682.7, timeStr: "11:22.7", phase: "", name: "青雷" },
      { id: 27, timeSec: 695.5, timeStr: "11:35.5", phase: "日出", name: "日出" },
      { id: 28, timeSec: 708.2, timeStr: "11:48.2", phase: "", name: "長短BUFF踩塔" },
      { id: 29, timeSec: 732.4, timeStr: "12:12.4", phase: "", name: "尖尾刺" },
      { id: 30, timeSec: 748.9, timeStr: "12:28.9", phase: "劍舞", name: "劍舞-1" },
      { id: 31, timeSec: 766.0, timeStr: "12:46.0", phase: "", name: "劍舞-2" },
      { id: 32, timeSec: 783.2, timeStr: "13:03.2", phase: "", name: "劍舞-3" },
      { id: 33, timeSec: 810.0, timeStr: "13:30.0", phase: "狂暴", name: "狂暴" }
    ];

    const app = createApp({
      setup() {
        const currentTab = ref('M3S');
        const timeline = ref(M3S_TIMELINE);
        const isPlaying = ref(false);
        const elapsed = ref(0);
        const soundEnabled = ref(true);
        
        const lariatState = ref(null);
        const lariatSplit = ref(null);
        const quakeState = ref(null);
        const quakeSplit = ref(null);
        const chainSplit = ref(null);

        const containerRef = ref(null);
        
        let startTime = null;
        let pausedTime = 0;
        let reqId = null;
        let audioCtx = null;
        
        let isUserScrolling = false;
        let scrollTimeout = null;

        const nextEvent = computed(() => {
          return timeline.value.filter(ev => ev.timeSec >= elapsed.value)[0] || null;
        });

        const progressPercent = computed(() => {
          if (!nextEvent.value) return 0;
          return Math.max(0, Math.min(100, (1 - (nextEvent.value.timeSec - elapsed.value) / 10) * 100));
        });

        const remainingTimeSec = computed(() => {
          if (!nextEvent.value) return 0;
          return nextEvent.value.timeSec - elapsed.value;
        });

        const remainingTimeStr = computed(() => {
          if (!nextEvent.value) return '0.0';
          const r = nextEvent.value.timeSec - Math.floor(elapsed.value * 10) / 10;
          return r < 0 ? '0.0' : r.toFixed(1);
        });

        const playBeep = (freq = 880, duration = 0.15) => {
          if (!soundEnabled.value) return;
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx && AudioContext) {
              audioCtx = new AudioContext();
            }
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
          } catch (e) {
            console.error("Audio playback failed", e);
          }
        };

        const updateTimer = () => {
          if (startTime !== null) {
            const now = performance.now();
            elapsed.value = pausedTime + (now - startTime) / 1000;
            reqId = requestAnimationFrame(updateTimer);
          }
        };

        watch(isPlaying, (playing) => {
          if (playing) {
            startTime = performance.now();
            reqId = requestAnimationFrame(updateTimer);
          } else {
            if (reqId) cancelAnimationFrame(reqId);
            if (startTime !== null) {
              pausedTime += (performance.now() - startTime) / 1000;
              startTime = null;
            }
          }
        });

        const handleScroll = () => {
          isUserScrolling = true;
          if (scrollTimeout) clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => {
            isUserScrolling = false;
          }, 5000);
        };

        onMounted(() => {
          if (containerRef.value) {
            containerRef.value.addEventListener('wheel', handleScroll, { passive: true });
            containerRef.value.addEventListener('touchmove', handleScroll, { passive: true });
          }
        });

        onUnmounted(() => {
          if (reqId) cancelAnimationFrame(reqId);
          if (containerRef.value) {
            containerRef.value.removeEventListener('wheel', handleScroll);
            containerRef.value.removeEventListener('touchmove', handleScroll);
          }
        });

        watch(() => nextEvent.value?.id, (newId) => {
          if (newId && isPlaying.value && !isUserScrolling) {
            nextTick(() => {
              const el = document.getElementById(`event-${newId}`);
              if (el && containerRef.value) {
                const rect = el.getBoundingClientRect();
                const containerRect = containerRef.value.getBoundingClientRect();
                if (rect.top < containerRect.top || rect.bottom > containerRect.bottom) {
                  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
              }
            });
          }
        });

        let alerted5s = false;
        let alerted0s = false;
        let lastEventId = null;

        watch([elapsed, isPlaying, nextEvent], ([e, playing, next]) => {
          if (lastEventId !== next?.id) {
            lastEventId = next?.id || null;
            alerted5s = false;
            alerted0s = false;
            lariatState.value = null;
            lariatSplit.value = null;
            quakeState.value = null;
            quakeSplit.value = null;
            chainSplit.value = null;
          }

          if (next && playing) {
            const timeToNext = next.timeSec - e;
            if (!alerted5s && timeToNext <= 5.0 && timeToNext > 0) {
              // 5秒提醒：較高音的提示
              playBeep(1200, 0.2);
              alerted5s = true;
            }
            if (!alerted0s && timeToNext <= 0.0) {
              // 0秒機制發動：預設音
              playBeep(880, 0.15);
              alerted0s = true;
            }
          }
        });

        const formatTime = (secs) => {
          const m = Math.floor(secs / 60);
          const s = Math.floor(secs % 60);
          const ms = Math.floor((secs % 1) * 10);
          return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms}`;
        };

        const handlePlayPause = () => {
          if (!isPlaying.value) {
            isPlaying.value = true;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx && AudioContext) {
              audioCtx = new AudioContext();
            }
            if (audioCtx?.state === 'suspended') {
              audioCtx.resume();
            }
          } else {
            isPlaying.value = false;
          }
        };

        const handleReset = () => {
          isPlaying.value = false;
          pausedTime = 0;
          elapsed.value = 0;
          startTime = null;
          alerted5s = false;
          alerted0s = false;
          lariatState.value = null;
          lariatSplit.value = null;
          quakeState.value = null;
          quakeSplit.value = null;
          chainSplit.value = null;
          if (containerRef.value) {
            containerRef.value.scrollTo({ top: 0, behavior: 'smooth' });
          }
        };

        const switchTab = (tab) => {
          if (currentTab.value === tab) return;
          currentTab.value = tab;
          timeline.value = tab === 'M3S' ? M3S_TIMELINE : M4S_TIMELINE;
          handleReset();
        };

        const handleAdjustTime = (delta) => {
          let newElapsed = elapsed.value + delta;
          if (newElapsed < 0) newElapsed = 0;
          
          elapsed.value = newElapsed;
          
          if (isPlaying.value) {
            if (startTime !== null) {
              startTime -= delta * 1000;
            }
          } else {
            pausedTime = newElapsed;
          }
        };

        const handleJumpToTime = (targetTimeSec) => {
          let newElapsed = Math.max(0, targetTimeSec - 3);
          elapsed.value = newElapsed;
          pausedTime = newElapsed;
          
          if (isPlaying.value) {
            startTime = performance.now();
          }
          alerted5s = false;
          alerted0s = false;
        };

        return {
          currentTab, switchTab,
          timeline, isPlaying, elapsed, soundEnabled,
          lariatState, lariatSplit, quakeState, quakeSplit, chainSplit,
          containerRef, nextEvent, progressPercent, remainingTimeSec, remainingTimeStr,
          formatTime, handlePlayPause, handleReset, handleAdjustTime, handleJumpToTime
        };
      }
    });
    
    app.component('lucide-icon', LucideIcon);
    app.mount('#app');
  </script>
